<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Props Universe — Sports Trading School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#081008;
    --line:#173417;
    --green:#3CFF6E;
    --green-dim:#1FA84A;
    --red:#EF4444;
    --silver-1:#FFFFFF;
    --silver-2:#A9B4AC;
    --text:#F2F5F0;
    --muted:#7FA085;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Background layers ---------- */
  .stars{
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1.2px 1.2px at 8% 22%, rgba(255,255,255,.75) 50%, transparent 100%),
      radial-gradient(1px 1px at 18% 68%, rgba(255,255,255,.5) 50%, transparent 100%),
      radial-gradient(1.6px 1.6px at 32% 12%, rgba(255,255,255,.8) 50%, transparent 100%),
      radial-gradient(1px 1px at 46% 78%, rgba(255,255,255,.45) 50%, transparent 100%),
      radial-gradient(1.4px 1.4px at 61% 34%, rgba(255,255,255,.7) 50%, transparent 100%),
      radial-gradient(1px 1px at 74% 58%, rgba(255,255,255,.5) 50%, transparent 100%),
      radial-gradient(1.7px 1.7px at 87% 20%, rgba(255,255,255,.8) 50%, transparent 100%),
      radial-gradient(1px 1px at 93% 82%, rgba(255,255,255,.5) 50%, transparent 100%),
      radial-gradient(1.3px 1.3px at 4% 90%, rgba(255,255,255,.6) 50%, transparent 100%),
      radial-gradient(1px 1px at 55% 6%, rgba(255,255,255,.4) 50%, transparent 100%);
    background-repeat:repeat;
    background-size:420px 420px;
    z-index:0;
    animation:twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{
    0%{opacity:.45;}
    100%{opacity:.85;}
  }

  .candles{
    position:fixed;
    inset:0;
    z-index:0;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:0 2vw 0;
    opacity:.16;
    overflow:hidden;
    animation:drift 50s linear infinite;
  }
  .candle{
    width:9px;
    border-radius:1.5px;
    flex-shrink:0;
  }
  .candle.up{background:var(--green);}
  .candle.down{background:var(--red);}
  @keyframes drift{
    0%{transform:translateX(0);}
    100%{transform:translateX(-180px);}
  }

  .glow{
    position:fixed;
    top:-8%;
    right:-8%;
    width:65vw;
    height:65vw;
    max-width:900px;
    max-height:900px;
    background:radial-gradient(circle, rgba(60,255,110,0.16) 0%, rgba(60,255,110,0) 70%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- Hero ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px 56px;
    position:relative;
    z-index:2;
  }

  .hero-grid{
    width:100%;
    max-width:1180px;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    align-items:center;
    gap:24px;
  }

  .copy-col{
    text-align:left;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--green);
    margin-bottom:18px;
  }

  .wordmark{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(2.9rem, 6.4vw, 5.2rem);
    line-height:0.92;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    background:linear-gradient(160deg, #FFFFFF 0%, #C7D0CA 35%, #8E9A93 55%, #F5F8F5 75%, #B7C1BB 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 18px rgba(255,255,255,0.08));
  }

  .rule{
    height:2px;
    width:100%;
    max-width:420px;
    background:linear-gradient(90deg, var(--green), transparent);
    margin:16px 0 14px;
  }

  .subtag{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:clamp(1rem, 2.1vw, 1.3rem);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--silver-2);
  }

  .datatag{
    margin-top:18px;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    color:var(--muted);
  }
  .datatag b{color:var(--text);font-weight:600;}

  .status-line{
    margin-top:34px;
    font-family:'Oswald',sans-serif;
    font-size:clamp(1.3rem, 3vw, 1.7rem);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }
  .status-line .accent{color:var(--green);}
  .status-line .plain-white{color:var(--silver-1);}

  .desc{
    color:var(--muted);
    max-width:460px;
    margin-top:14px;
    line-height:1.6;
    font-size:0.96rem;
  }

  form{
    margin-top:32px;
    display:flex;
    gap:10px;
    width:100%;
    max-width:420px;
  }
  input[type="email"]{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="email"]:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(60,255,110,0.12);
  }
  input[type="email"]::placeholder{color:var(--muted);}

  button{
    background:var(--green);
    color:#03130A;
    border:none;
    border-radius:8px;
    padding:14px 22px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:0.9rem;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
    white-space:nowrap;
  }
  button:hover{opacity:0.88;}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.5;cursor:default;}

  .msg{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    min-height:20px;
  }
  .msg.ok{color:var(--green);}
  .msg.err{color:var(--red);}

  .count{
    margin-top:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .count b{color:var(--green);}

  /* ---------- Planet column ---------- */
  .planet-col{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .planet-wrap{
    position:relative;
    width:100%;
    max-width:480px;
  }
  .planet-img{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 0 55px rgba(60,255,110,0.45)) drop-shadow(0 0 110px rgba(60,255,110,0.18));
    animation:float 6.5s ease-in-out infinite;
  }
  @keyframes float{
    0%{transform:translateY(0) rotate(-1.2deg);}
    50%{transform:translateY(-18px) rotate(1.2deg);}
    100%{transform:translateY(0) rotate(-1.2deg);}
  }
  .ring-pulse{
    position:absolute;
    left:50%;
    top:52%;
    width:78%;
    height:78%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(60,255,110,0.22) 0%, rgba(60,255,110,0) 65%);
    animation:pulse 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(0.94);}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.04);}
  }
  .beam{
    position:absolute;
    left:50%;
    top:6%;
    width:3px;
    height:34%;
    background:linear-gradient(180deg, rgba(60,255,110,0.55), rgba(60,255,110,0));
    transform:translateX(-50%);
    opacity:0.5;
    filter:blur(1.5px);
  }

  @media (max-width:880px){
    .hero-grid{
      grid-template-columns:1fr;
      text-align:center;
    }
    .copy-col{text-align:center;}
    .rule{margin-left:auto;margin-right:auto;}
    form{margin-left:auto;margin-right:auto;}
    .planet-col{order:-1;}
    .planet-wrap{max-width:280px;margin:0 auto 8px;}
    .datatag,.desc{margin-left:auto;margin-right:auto;}
  }

  @media (prefers-reduced-motion: reduce){
    .candles,.stars,.planet-img,.ring-pulse{animation:none;}
  }

  footer{
    text-align:center;
    padding:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--muted);
    letter-spacing:0.08em;
    border-top:1px solid var(--line);
    position:relative;
    z-index:3;
    background:var(--bg);
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="glow"></div>
  <div class="candles" id="candles"></div>

  <main>
    <div class="hero-grid">
      <div class="copy-col">
        <div class="eyebrow">Launching Soon</div>
        <div class="wordmark">Props<br>Universe</div>
        <div class="rule"></div>
        <div class="subtag">Sports Trading School</div>
        <div class="datatag"><b>A Data-Driven</b> Approach to Player Prop Markets</div>
        <div class="status-line">The <span class="accent">numbers</span> tell the <span class="plain-white">story</span></div>
        <p class="desc">Built to help sports fans understand the data, recognize meaningful patterns, and make smarter decisions.</p>

        <form id="waitlistForm">
          <input type="email" id="emailInput" name="email" placeholder="you@email.com" required>
          <button type="submit" id="submitBtn">Get the Signal</button>
        </form>
        <div class="msg" id="msg"></div>
        <div class="count" id="count"></div>
      </div>

      <div class="planet-col">
        <div class="planet-wrap">
          <div class="ring-pulse"></div>
          <div class="beam"></div>
          <img class="planet-img" src="data:image/png;base64,PASTE_YOUR_BASE64_IMAGE_HERE" alt="Props Universe planet">
        </div>
      </div>
    </div>
  </main>

  <footer>© 2026 PROPS UNIVERSE · SPORTS TRADING SCHOOL</footer>

<script>
  // Background candlestick field
  const candlesEl = document.getElementById('candles');
  let bars = '';
  for(let i=0;i<70;i++){
    const h = 20 + Math.round(Math.random()*160);
    const up = Math.random() > 0.4;
    bars += `<div class="candle ${up?'up':'down'}" style="height:${h}px"></div>`;
  }
  candlesEl.innerHTML = bars + bars;

  // ---------- Waitlist: Formspree ----------
  const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mjybnwpw';

  const form = document.getElementById('waitlistForm');
  const emailInput = document.getElementById('emailInput');
  const msg = document.getElementById('msg');
  const countEl = document.getElementById('count');
  const submitBtn = document.getElementById('submitBtn');

  function getLocalCount(){
    return parseInt(localStorage.getItem('pu-waitlist-count') || '0', 10);
  }
  function setLocalCount(n){
    localStorage.setItem('pu-waitlist-count', String(n));
  }
  function refreshCount(){
    const n = getLocalCount();
    countEl.innerHTML = n > 0
      ? `<b>${n}</b> joining the waitlist`
      : '— joining the waitlist';
  }
  refreshCount();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if(!email){ return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    msg.className = 'msg';
    msg.textContent = '';

    try{
      const data = new FormData(form);
      const response = await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        setLocalCount(getLocalCount() + 1);
        refreshCount();
        form.reset();
        form.style.display = 'none';
        msg.classList.add('ok');
        msg.textContent = "You're on the list — we'll be in touch.";
      } else {
        const payload = await response.json().catch(() => null);
        const errText = payload && payload.errors && payload.errors.length
          ? payload.errors.map(er => er.message).join(', ')
          : 'Something went wrong. Please try again.';
        msg.classList.add('err');
        msg.textContent = errText;
      }
    } catch (err) {
      msg.classList.add('err');
      msg.textContent = 'Something went wrong. Please try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Notify Me';
    }
  });
</script>
</body>
</html>
